# CI definition. Activate by moving this file to .github/workflows/ci.yml
# (it ships under docs/ because the publishing integration cannot write
# .github/workflows/ directly — see docs/architecture.md).
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python examples/run_demo.py
