[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-migration-platform"
version = "0.1.0"
description = "Governed, resumable data-migration platform: declarative mappings, dry-run/apply, reconciliation, quarantine, rollback."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
